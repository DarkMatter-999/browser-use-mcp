<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Use</title>
  </head>
  <body>
    <main class="popup">
      <h1 class="popup-title">Browser Use</h1>
      <p id="headline" class="popup-status" data-tone="neutral" aria-live="polite">Loading…</p>
      <p id="detail" class="popup-detail" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
      <form id="pair-form" class="pair-form" hidden>
        <label class="pair-label" for="code">Pairing code</label>
        <input
          id="code"
          class="pair-input"
          type="text"
          maxlength="9"
          autocomplete="off"
          spellcheck="false"
          placeholder="ABCD-2345"
        />
        <button type="submit" class="button button-primary">Pair</button>
      </form>
      <div class="actions">
        <button id="connect" type="button" class="button button-primary">Connect this tab</button>
        <button id="disconnect" type="button" class="button">Disconnect this tab</button>
        <button id="disconnect-all" type="button" class="button">Disconnect all</button>
      </div>
      <section class="settings" aria-labelledby="settings-title">
        <h2 id="settings-title" class="settings-title">Settings</h2>
        <label class="setting" for="always-connected">
          <input
            id="always-connected"
            class="setting-input"
            type="checkbox"
            role="switch"
            aria-describedby="always-connected-help"
          />
          <span class="setting-label">Let the agent open tabs (keep connected)</span>
        </label>
        <p id="always-connected-help" class="setting-help">
          When off, Browser Use only connects while a tab is connected. The agent can't open tabs
          until you connect one.
        </p>
      </section>
    </main>
    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
